name: whoop-apk

# Riset saja: mengambil aplikasi WHOOP Android untuk mempelajari cara aplikasi
# itu membaca data band milik saya sendiri. File ditaruh di DRAFT release
# (tidak publik) dan dihapus setelah dianalisis. Tidak ada yang di-commit.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Android package id'
        default: 'com.whoop.android'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PKG: ${{ inputs.package }}
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
    steps:
      - name: Install apkeep
        run: |
          curl -fsSL -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep && ./apkeep --version
      - name: Download (tries several sources)
        run: |
          mkdir -p out
          ok() { find out -type f -size +5M | grep -q . ; }
          echo "== 1. apkeep APKPure: versions"
          ./apkeep -l -a "$PKG" -d apk-pure || true
          echo "== 2. apkeep APKPure: download"
          ./apkeep -a "$PKG" -d apk-pure -o 'acknowledge_dangers=true' out || true
          ok || { echo "== 3. APKPure direct XAPK";
            curl -fL -A "$UA" -o out/whoop.xapk "https://d.apkpure.com/b/XAPK/$PKG?version=latest" || true; }
          ok || { echo "== 4. APKPure direct APK";
            curl -fL -A "$UA" -o out/whoop.apk "https://d.apkpure.com/b/APK/$PKG?version=latest" || true; }
          find out -type f -size -5M -delete
          ls -la out
          for f in out/*; do echo "$f: $(file -b "$f")"; sha256sum "$f"; done
          ok
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete re-whoop --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create re-whoop --repo "$GITHUB_REPOSITORY" --draft \
            --title "re-whoop (draft, research only)" --notes "Not published. Deleted after analysis." out/*
