name: android-release

# Builds the Android APK. Run it by hand from the Actions tab
# (workflow_dispatch) with `release_tag` to attach ProjectFit.apk to that
# GitHub release (the one ios-sideload creates), or leave it empty for an
# artifact only. A pushed v* tag does the same.
#
# SIGNING. Android only installs an update over an app signed with the same
# key, and ProjectFit keeps its data on the phone, so a key change means
# uninstalling — and losing that data. The release key therefore comes from
# repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; see docs/ANDROID.md). Without them
# the build falls back to a throwaway debug key and the file is named
# ProjectFit-test.apk so it is never mistaken for an updatable release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to this release tag (e.g. v0.16.0); empty = artifact only'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    permissions:
      contents: write # only used to attach to a release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned, same as ios-sideload: the app does not build on 3.44.x yet.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # Secrets pasted from a phone often carry a stray newline, spaces, or the
      # "NAME = " prefix from SECRETS.txt; all of that is stripped here. Then
      # keytool checks the pair before Gradle does, and says WHICH part is
      # wrong without printing either value.
      - name: Release key (from secrets, if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          clean() { local v; v="$(printf '%s' "$1" | tr -d ' \t\r\n')"; printf '%s' "${v#ANDROID_*=}"; }
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: debug-signed test build. It cannot be updated in place; see docs/ANDROID.md."
            echo "APK_NAME=ProjectFit-test.apk" >> "$GITHUB_ENV"
            echo "APK_SUFFIX=-test" >> "$GITHUB_ENV"
            exit 0
          fi
          B64="$(clean "$KEYSTORE_B64")"
          if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64: paste the WHOLE of keystore.base64.txt (about 5,100 characters) and nothing else."
            exit 1
          fi
          SIZE=$(stat -c %s "$RUNNER_TEMP/release.jks")
          echo "Decoded keystore: $SIZE bytes (the ProjectFit key is 3836)."
          KS="$(clean "$KS_PASS")"; KP="$(clean "$KEY_PASS")"; AL="$(clean "$KEY_ALIAS")"
          echo "Password lengths: store ${#KS}, key ${#KP} (both 28 for the ProjectFit key); alias length ${#AL}."
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS" >/dev/null 2>&1; then
            if [ "$SIZE" != "3836" ]; then
              echo "::error::The keystore is incomplete ($SIZE bytes, expected 3836): ANDROID_KEYSTORE_BASE64 was cut short. Paste the whole of keystore.base64.txt again."
            else
              echo "::error::The keystore is complete but ANDROID_KEYSTORE_PASSWORD does not open it. Paste only the password from SECRETS.txt (28 letters and digits)."
            fi
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS" -alias "$AL" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS does not name the key in this keystore. It should be: projectfit"
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS"
            echo "ANDROID_KEY_PASSWORD=$KP"
            echo "ANDROID_KEY_ALIAS=$AL"
            echo "APK_NAME=ProjectFit.apk"
            echo "APK_SUFFIX="
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS"
          echo "::add-mask::$KP"

      - name: Build APK
        run: flutter build apk --release

      - name: Name the APK
        run: |
          REF="${RELEASE_TAG}"
          if [ -z "$REF" ]; then REF="$(git rev-parse --short HEAD)"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/$APK_NAME"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/projectfit-${REF}${APK_SUFFIX}.apk"
          echo "VERSIONED=projectfit-${REF}${APK_SUFFIX}.apk" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE"/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: projectfit-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.VERSIONED }}
          retention-days: 30

      # No `body`: the release text is written by ios-sideload and already has
      # the Android row; this only adds the files.
      - name: Attach the APK to the release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.VERSIONED }}
