name: ios-sideload

# An UNSIGNED iOS .ipa for sideloading with a free Apple ID (Sideloadly,
# AltStore, SideStore). No paid Apple Developer account is involved: the
# sideloading tool re-signs the app with the user's own Apple ID on install.
# See docs/IOS_SIDELOAD.md.
#
# Run it by hand from the Actions tab (workflow_dispatch), or push a v* tag to
# also attach the .ipa and an AltStore source (apps.json) to a GitHub release.
# A manual run with `release_tag` set does the same, creating that tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.11.3); empty = artifact only'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    permissions:
      contents: write # only used to attach to a release on tag pushes
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned: the app does not build on Flutter 3.44.x yet (see app/AGENTS.md).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # `flutter build ios --no-codesign` does not reach every target: the
      # Watch companion (and, on newer Xcode, extensions) still asks for a
      # Development Team. So Flutter only writes its configuration here, and
      # xcodebuild runs with signing switched off as COMMAND-LINE settings,
      # which apply to every target in the build.
      - name: Configure Flutter for a release build
        run: flutter build ios --release --no-codesign --config-only

      - name: Build unsigned iOS app (xcodebuild, no signing on any target)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*sign|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      # The failing command is usually far from the end of a 10k-line log:
      # print every failed command with the lines before it, and the tail.
      - name: Show why xcodebuild failed
        if: failure()
        working-directory: app/ios
        run: |
          grep -nE "(error|fatal):|Command .* failed|FAILED|requires a development team|Signing for" xcodebuild.log | head -60 || true
          echo "----- context before each failed command -----"
          grep -nB25 "Command .* failed with a nonzero exit code" xcodebuild.log | tail -150 || true
          echo "----- tail -----"
          tail -60 xcodebuild.log

      - name: Upload the xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/ios/xcodebuild.log

      # The Watch companion cannot survive a free-account re-sign: its
      # Info.plist names the phone app's bundle id, and every sideloading tool
      # gives the phone app a new per-user id without patching that key. The
      # app installs without it; a source build with one signing identity
      # keeps it.
      - name: Strip Watch companion
        run: rm -rf ios/build/dd/Build/Products/Release-iphoneos/Runner.app/Watch

      - name: Package unsigned IPA
        id: ipa
        run: |
          REF="${RELEASE_TAG}"
          if [ -z "$REF" ]; then REF="$(git rev-parse --short HEAD)"; fi
          NAME="projectfit-${REF}-unsigned.ipa"
          cd ios/build/dd/Build/Products/Release-iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr -y "$GITHUB_WORKSPACE/$NAME" Payload
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$GITHUB_WORKSPACE/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: projectfit-ipa
          path: ${{ steps.ipa.outputs.name }}
          retention-days: 30

      - name: Generate AltStore source
        if: env.RELEASE_TAG != ''
        working-directory: .
        run: |
          python3 .github/scripts/gen_altstore_source.py \
            "${{ steps.ipa.outputs.name }}" apps.json "${{ github.repository }}" "$RELEASE_TAG"
          # A fixed name too, so releases/latest/download/ProjectFit.ipa is a
          # download link that never changes (docs/IOS_SIDELOAD.md uses it).
          cp "${{ steps.ipa.outputs.name }}" ProjectFit.ipa

      - name: Attach IPA + AltStore source to the release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.ipa.outputs.name }}
            ProjectFit.ipa
            apps.json
          body: |
            ## 📲 Cara pasang di iPhone

            ProjectFit dipasang **gratis** dengan Apple ID sendiri, tanpa App Store dan tanpa jailbreak.

            | iPhone Anda | Cara |
            |---|---|
            | **iOS 27 ke atas** (cukup iPhone) | Pasang SideStore, lalu tambahkan sumber `https://github.com/${{ github.repository }}/releases/latest/download/apps.json` |
            | **iOS 15 – 26** (pakai komputer) | Unduh **ProjectFit.ipa** di bawah, lalu pasang dengan Sideloadly |

            👉 **[Tutorial lengkap langkah demi langkah](https://github.com/${{ github.repository }}/blob/main/docs/IOS_SIDELOAD.md)**

            ### ⬇️ File di rilis ini
            - **ProjectFit.ipa**: file aplikasinya. Ini yang Anda unduh.
            - `projectfit-…-unsigned.ipa`: file yang sama, dengan nomor versi di namanya.
            - `apps.json`: sumber untuk SideStore/AltStore. Tidak perlu diunduh.
            - *Source code*: untuk pengembang.
