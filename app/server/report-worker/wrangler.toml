name = "openstrap-reports"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Custom domain: reports.openstrap.site (attach in the dashboard or uncomment).
routes = [{ pattern = "reports.openstrap.site", custom_domain = true }]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "openstrap-reports"

[[d1_databases]]
binding = "DB"
database_name = "openstrap-reports"
database_id = "5fe4e352-1b24-4021-99db-23742c833d1b"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]   # daily 03:17 UTC cleanup

# Secrets (wrangler secret put): ADMIN_TOKEN (required); GITHUB_TOKEN, GITHUB_REPO (optional, e.g. OpenStrap/reports)
